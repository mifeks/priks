<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прикс</title>
<meta name="robots" content="noindex">
<style>
  html, body { height: 100%; margin: 0; display: grid; place-items: center; background: #f6f5f1; color: #1c1e22; font-family: system-ui, -apple-system, sans-serif; }
  .box { text-align: center; }
  .tile { width: 54px; height: 54px; border-radius: 15px; background: #b78d4a; color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 23px; margin: 0 auto 14px; }
  p { color: #8a8f98; font-size: .9rem; }
  a { color: #b78d4a; }
</style>
</head>
<body>
<div class="box">
  <div class="tile">П</div>
  <div id="msg">Открываем Прикс…</div>
  <p><a id="link" href="#" hidden>Открыть вручную</a></p>
</div>
<script>
var params = new URLSearchParams(location.search);
var to = params.get("to") || "";
var tail = to === "reg" ? "?reg=1" : (to === "yan" || to === "yandex") ? "?yandex=1" : "";
var target = "http://51.250.92.168:8777/" + tail;
var link = document.getElementById("link");
link.href = target;
link.hidden = false;
setTimeout(function () { location.replace(target); }, 200);
</script>
</body>
</html>
