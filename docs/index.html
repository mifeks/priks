<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Прикс — открываем мессенджер</title>
<meta http-equiv="refresh" content="0; url=http://51.250.92.168:8777/">
<meta name="robots" content="noindex">
<style>
  :root { --accent: #b78d4a; --bg: #f7f3ea; --text: #241f18; --muted: #7b7266; --line: #ddd3c1; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
  }
  .card { width: 100%; max-width: 380px; text-align: center; }
  .logo {
    width: 60px; height: 60px; margin: 0 auto 18px; border-radius: 16px;
    display: grid; place-items: center; background: var(--accent); color: #fff;
    font-weight: 700; font-size: 26px;
  }
  h1 {
    margin: 0 0 10px; font-family: 'Playfair Display', Georgia, serif;
    font-size: 34px; font-weight: 600; letter-spacing: .01em;
  }
  p { margin: 0 0 22px; color: var(--muted); font-size: 15px; line-height: 1.55; }
  .btn {
    display: block; padding: 14px 18px; border-radius: 12px; text-decoration: none;
    background: var(--accent); color: #fff; font-weight: 600; font-size: 15px;
    border: 1px solid var(--accent);
  }
  .btn:hover { filter: brightness(.95); }
  .hint { margin: 14px 0 0; font-size: 12.5px; color: var(--muted); }
  .addr { margin: 18px 0 0; font-size: 12.5px; color: var(--muted); word-break: break-all; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">П</div>
  <h1>Прикс</h1>
  <p>Мессенджер работает на своём сервере — сейчас откроем его в браузере.</p>
  <a class="btn" href="http://51.250.92.168:8777/">Открыть Прикс</a>
  <p class="addr">http://51.250.92.168:8777/</p>
  <p class="hint">Если переход не начался сам, нажмите кнопку выше.</p>
</div>
<script>location.replace("http://51.250.92.168:8777/");</script>
</body>
</html>
